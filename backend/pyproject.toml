[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-cenovnici-api"
version = "0.1.0"
description = "AI Monitor Hub API backend"
readme = "README.md"
requires-python = ">=3.12,<3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi>=0.104.0,<1.0.0",
    "uvicorn[standard]>=0.24.0,<1.0.0",
    "pydantic>=2.13.4,<3.0.0",
    "pydantic-settings>=2.0.0,<3.0.0",
    "SQLAlchemy>=2.0.0,<3.0.0",
    "asyncpg>=0.28.0,<1.0.0",
    "alembic>=1.12.0,<2.0.0",
    "bleach>=6.2.0,<7.0.0",
    "cryptography>=45.0.0,<47.0.0",
    "redis>=6.4.0,<7.0.0",
    "regex>=2026.7.19,<2027.0.0",
    "starlette>=1.3.1,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10.0.0",
    "pytest-asyncio>=1.3.0,<2.0.0",
    "httpx>=0.24.0,<1.0.0",
    "black>=26.3.1,<27.0.0",
    "ruff==0.12.5",
    "mypy>=1.0.0,<2.0.0",
    "pip-audit>=2.10.1,<3.0.0",
    "pytest-cov>=7.1.0,<8.0.0",
    "pytest-randomly>=4.1.0,<5.0.0",
    "pytest-xdist>=3.8.0,<4.0.0",
    "types-bleach>=6.4.0.20260607,<7.0.0",
    "types-regex>=2026.7.19.20260720,<2027.0.0",
]

[project.scripts]
ai-cenovnici-api = "app.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 88
force-exclude = true

[tool.ruff.lint]
extend-ignore = ["E203"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/cea65f170298_initial_database_schema.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
exclude = ["alembic/versions/*.py"]

[tool.black]
line-length = 88
target-version = ["py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  \.eggs
  | \.git
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
