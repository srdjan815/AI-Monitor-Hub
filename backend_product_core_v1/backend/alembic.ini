# A generic, single database configuration.

[alembic]

# Path to migration scripts
script_location = %(here)s/alembic

# Add backend directory to Python path
prepend_sys_path = %(here)s

# Path separator
path_separator = os

# Database URL is loaded dynamically from app.core.config.settings
# Do NOT hardcode sqlalchemy.url here.

# File template
# file_template = %%(rev)s_%%(slug)s

# Timezone
# timezone =

# Truncate revision slug length
# truncate_slug_length = 40

# Version locations
# version_locations = %(here)s/alembic/versions

# Recursive version locations
# recursive_version_locations = false

# Output encoding
# output_encoding = utf-8


[post_write_hooks]



# ---------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S